# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Optimized for faster debug builds
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.workers.max=4
org.gradle.build.cache=true
org.gradle.caching=true
org.gradle.daemon.usesOutputFile=false
org.gradle.incremental=true

# Kotlin compiler optimization
kotlin.incremental=true
kotlin.incremental.js=true
kotlin.compiler.incremental.usePreciseJavaTracking=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Use this property to specify which architecture you want to build.
# For DEBUG builds, use only arm64-v8a for faster compilation
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=arm64-v8a

# Use this property to enable support to the new architecture for RELEASE only.
# Disable for debug to speed up builds
newArchEnabled=false

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# Use Java 17 from Homebrew
org.gradle.java.home=/usr/local/opt/openjdk@17
# ============================================================================
# PRODUCTION BUILD CONFIGURATION
# ============================================================================

# ProGuard/R8 Minification (enables code shrinking)
ENABLE_PROGUARD_IN_RELEASE_BUILDS=true

# Release Signing Configuration
# Credentials are stored in android/keystore.properties (gitignored, never commit passwords here)
# See keystore.properties.example for the required format

# Build configuration for production
BUILD_CACHE_ENABLED=true
PARALLEL_BUILD_ENABLED=true